[project]
name = "multimodal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-experimental>=0.4.2",
    "langchain-ollama>=1.1.0",
    "llama-parse>=0.6.94",
    "pypdf>=6.21.2",
]

[project.scripts]
multimodal = "multimodal:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
